name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zsh (not preinstalled on the runner)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install flake8
        run: pip install flake8

      - name: Lint (scope and excludes come from setup.cfg)
        run: flake8 .

      - name: Version drift guard (README vs plugin.json vs marketplace.json)
        # A version claim that survives in a document longer than in the code
        # is the 4.1.0 "Never commit" defect wearing a different hat. The
        # README's opening line, plugin.json and marketplace.json must agree.
        run: |
          set -e
          readme=$(grep -m1 -oP '(?<=\*\*Version )[0-9]+\.[0-9]+\.[0-9]+(?=\*\*)' README.md)
          plugin=$(python3 -c "import json; print(json.load(open('plugins/phased-workflow/.claude-plugin/plugin.json'))['version'])")
          market=$(python3 -c "import json; d=json.load(open('.claude-plugin/marketplace.json')); print(d['plugins'][0]['version'])")
          echo "README=$readme plugin.json=$plugin marketplace.json=$market"
          [ "$readme" = "$plugin" ] && [ "$plugin" = "$market" ] || { echo "version drift"; exit 1; }

      - name: Configure git identity (S17 creates real commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Orchestration suite under bash
        run: bash tests/orchestration/run_tests.sh

      - name: Orchestration suite under zsh
        run: zsh tests/orchestration/run_tests.sh

      - name: Validate the benchmark fixture plan
        run: python3 plugins/phased-workflow/scripts/next-phase.py --validate tests/benchmark/fixture/.phased/active/bench/plan.md
