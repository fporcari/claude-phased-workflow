name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install zsh (not preinstalled on the runner)
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install flake8
        run: pip install flake8

      - name: Lint (scope and excludes come from setup.cfg)
        run: flake8 .

      - name: Configure git identity (S17 creates real commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Orchestration suite under bash
        run: bash tests/orchestration/run_tests.sh

      - name: Orchestration suite under zsh
        run: zsh tests/orchestration/run_tests.sh

      - name: Validate the benchmark fixture plan
        run: python3 plugins/phased-workflow/scripts/next-phase.py --validate tests/benchmark/fixture/.phased/active/bench/plan.md
