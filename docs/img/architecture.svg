<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" role="img" aria-label="Workflow architecture: desktop chats on top, disposable headless sessions in the middle, the git branch at the bottom — all real work converges on disk">
  <defs>
    <marker id="aI" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#16324F"/></marker>
    <marker id="aIs" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#4A6076"/></marker>
    <marker id="aO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#E8630A"/></marker>
    <marker id="aOr" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M8,0 L0,4.5 L8,9 z" fill="#E8630A"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="770" rx="10" fill="#EEF1F4"/>

  <rect x="20" y="100" width="860" height="175" rx="10" fill="#F7F9FA" stroke="#C9D2DA"/>
  <text x="36" y="124" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#4A6076">DESKTOP CHATS — MORTAL, WITH THE HUMAN INSIDE</text>
  <rect x="20" y="330" width="860" height="155" rx="10" fill="#F7F9FA" stroke="#C9D2DA"/>
  <text x="36" y="354" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#4A6076">HEADLESS — DISPOSABLE, FRESH PER TASK</text>
  <rect x="20" y="540" width="860" height="160" rx="10" fill="#F7F9FA" stroke="#C9D2DA"/>

  <line x1="450" y1="66" x2="450" y2="138" stroke="#E8630A" stroke-width="2.5" marker-end="url(#aO)" marker-start="url(#aOr)"/>
  <text x="462" y="106" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">commands · stop or go</text>
  <line x1="260" y1="195" x2="343" y2="195" stroke="#16324F" stroke-width="2" marker-end="url(#aI)"/>
  <text x="301" y="186" font-size="11.5" fill="#4A6076" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" style="paint-order:stroke" stroke="#F7F9FA" stroke-width="4">phase done</text>
  <line x1="640" y1="195" x2="557" y2="195" stroke="#16324F" stroke-width="2" marker-end="url(#aI)"/>
  <text x="598" y="186" font-size="11.5" fill="#4A6076" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" style="paint-order:stroke" stroke="#F7F9FA" stroke-width="4">stop-work?</text>
  <line x1="715" y1="252" x2="205" y2="368" stroke="#4A6076" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aIs)"/>
  <text x="468" y="300" font-size="11.5" fill="#4A6076" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" style="paint-order:stroke" stroke="#EEF1F4" stroke-width="4">watches the log</text>
  <path d="M 530 252 L 530 300 L 862 300 L 862 648 L 786 648" fill="none" stroke="#4A6076" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aIs)"/>
  <text x="742" y="293" font-size="11.5" fill="#4A6076" font-family="Helvetica,Arial,sans-serif" style="paint-order:stroke" stroke="#EEF1F4" stroke-width="4">reads only</text>
  <line x1="282" y1="417" x2="343" y2="417" stroke="#16324F" stroke-width="2" marker-end="url(#aI)"/>
  <line x1="557" y1="417" x2="638" y2="417" stroke="#16324F" stroke-width="2" marker-end="url(#aI)"/>
  <text x="597" y="408" font-size="11.5" fill="#4A6076" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" style="paint-order:stroke" stroke="#F7F9FA" stroke-width="4">findings</text>
  <line x1="155" y1="252" x2="155" y2="576" stroke="#E8630A" stroke-width="4" marker-end="url(#aO)"/>
  <line x1="195" y1="467" x2="195" y2="576" stroke="#E8630A" stroke-width="4" marker-end="url(#aO)"/>
  <line x1="730" y1="467" x2="730" y2="576" stroke="#E8630A" stroke-width="4" marker-end="url(#aO)"/>

  <ellipse cx="450" cy="38" rx="72" ry="26" fill="#E8630A"/>
  <text x="450" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">User</text>

  <rect x="50" y="140" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="155" y="176" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Phase chat</text>
  <text x="155" y="199" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#4A6076">/execute-phase</text>
  <text x="155" y="219" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">interactive</text>

  <rect x="345" y="140" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="450" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Foreman</text>
  <text x="450" y="195" text-anchor="middle" font-size="12" font-family="Menlo,Consolas,monospace" fill="#E8630A">wf:slug:foreman</text>
  <text x="450" y="217" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">board &amp; decisions</text>

  <rect x="640" y="140" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="745" y="172" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Inspector</text>
  <text x="745" y="195" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">launched /run-workflow,</text>
  <text x="745" y="214" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">watches the EVENT: lines</text>

  <rect x="90" y="370" width="192" height="95" rx="8" fill="#FFFFFF" stroke="#4A6076" stroke-width="1.5"/>
  <text x="186" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Executors</text>
  <text x="186" y="424" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">one session per phase,</text>
  <text x="186" y="442" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">fresh context</text>

  <rect x="345" y="370" width="212" height="95" rx="8" fill="#FFFFFF" stroke="#4A6076" stroke-width="1.5"/>
  <text x="451" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Verifier · UI judge</text>
  <text x="451" y="426" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">read-only, fresh eyes</text>

  <rect x="640" y="370" width="180" height="95" rx="8" fill="#FFFFFF" stroke="#4A6076" stroke-width="1.5"/>
  <text x="730" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Repair</text>
  <text x="730" y="426" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">one attempt, then stop</text>

  <rect x="140" y="580" width="640" height="100" rx="12" fill="#16324F"/>
  <text x="460" y="614" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF" font-family="Helvetica,Arial,sans-serif">the git branch</text>
  <text x="460" y="639" text-anchor="middle" font-size="12.5" font-family="Menlo,Consolas,monospace" fill="#B8C6D4">plan.md · notes.md · foreman.json · mockups/</text>
  <text x="460" y="662" text-anchor="middle" font-size="12" fill="#F2A26B" font-family="Helvetica,Arial,sans-serif">survives everything</text>

  <line x1="40" y1="738" x2="70" y2="738" stroke="#E8630A" stroke-width="4"/>
  <text x="78" y="742" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">writes to disk — the only arrows that count</text>
  <line x1="390" y1="738" x2="420" y2="738" stroke="#16324F" stroke-width="2"/>
  <text x="428" y="742" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">messages (best-effort, can be lost)</text>
  <line x1="680" y1="738" x2="710" y2="738" stroke="#4A6076" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="718" y="742" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">observation, read-only</text>
  <text x="36" y="564" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#4A6076" style="paint-order:stroke" stroke="#F7F9FA" stroke-width="5">DISK — IMMORTAL</text>
</svg>
