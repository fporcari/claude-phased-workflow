<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" role="img" aria-label="The phase loop: execute, verify with fresh eyes, one repair, then stop">
  <defs>
    <marker id="bI" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#16324F"/></marker>
    <marker id="bV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#2E7D5B"/></marker>
    <marker id="bO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#E8630A"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="240" rx="10" fill="#F4F6F8"/>

  <rect x="30" y="50" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="105" y="83" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Execute</text>

  <rect x="260" y="50" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="365" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Verify</text>
  <text x="365" y="95" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">fresh eyes, read-only</text>

  <rect x="660" y="50" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="2.5"/>
  <text x="755" y="83" text-anchor="middle" font-size="15" font-weight="600" fill="#2E7D5B" font-family="Helvetica,Arial,sans-serif">Next phase</text>

  <rect x="260" y="155" width="210" height="56" rx="8" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text x="365" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#16324F" font-family="Helvetica,Arial,sans-serif">Repair</text>
  <text x="365" y="200" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">one attempt, fresh eyes</text>

  <rect x="660" y="155" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#E8630A" stroke-width="2.5"/>
  <text x="755" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#E8630A" font-family="Helvetica,Arial,sans-serif">Stop</text>
  <text x="755" y="200" text-anchor="middle" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif">and write down why</text>

  <line x1="180" y1="78" x2="258" y2="78" stroke="#16324F" stroke-width="2" marker-end="url(#bI)"/>
  <line x1="470" y1="78" x2="658" y2="78" stroke="#2E7D5B" stroke-width="2" marker-end="url(#bV)"/>
  <text x="560" y="69" text-anchor="middle" font-size="12" fill="#2E7D5B" font-family="Helvetica,Arial,sans-serif" font-weight="600">ok</text>
  <line x1="365" y1="106" x2="365" y2="153" stroke="#E8630A" stroke-width="2" marker-end="url(#bO)"/>
  <text x="378" y="135" font-size="12" fill="#E8630A" font-family="Helvetica,Arial,sans-serif" font-weight="600">ko</text>
  <path d="M 258 183 H 215 V 90 H 256" fill="none" stroke="#16324F" stroke-width="2" marker-end="url(#bI)"/>
  <text x="205" y="135" font-size="12" fill="#4A6076" font-family="Helvetica,Arial,sans-serif" text-anchor="end">re-verify</text>
  <line x1="470" y1="183" x2="658" y2="183" stroke="#E8630A" stroke-width="2" marker-end="url(#bO)"/>
  <text x="560" y="174" text-anchor="middle" font-size="12" fill="#E8630A" font-family="Helvetica,Arial,sans-serif" font-weight="600">ko again</text>
</svg>
