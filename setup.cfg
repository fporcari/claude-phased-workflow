[flake8]
# The quality gate for this repo's own tooling. The benchmark fixtures are
# excluded on purpose: they are inputs to a measured phase, and their lint
# state is part of what a run is judged on, not of this repo's style.
max-line-length = 120
exclude = .git,__pycache__,.pytest_cache,tests/benchmark/fixture,tests/benchmark/fixture-seeded,tests/benchmark/results
